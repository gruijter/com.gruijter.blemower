<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Central vertical arm -->
  <line x1="12" y1="2" x2="12" y2="22" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Central horizontal arm -->
  <line x1="2" y1="12" x2="22" y2="12" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Diagonal arm top-left to bottom-right -->
  <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Diagonal arm top-right to bottom-left -->
  <line x1="19.07" y1="4.93" x2="4.93" y2="19.07" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Top arm branches -->
  <line x1="12" y1="4.5" x2="10" y2="2.5" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="4.5" x2="14" y2="2.5" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Bottom arm branches -->
  <line x1="12" y1="19.5" x2="10" y2="21.5" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="19.5" x2="14" y2="21.5" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Left arm branches -->
  <line x1="4.5" y1="12" x2="2.5" y2="10" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="4.5" y1="12" x2="2.5" y2="14" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right arm branches -->
  <line x1="19.5" y1="12" x2="21.5" y2="10" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="19.5" y1="12" x2="21.5" y2="14" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="12" cy="12" r="1.3" fill="#000000"/>
</svg>
